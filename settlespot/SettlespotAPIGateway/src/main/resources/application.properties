spring.application.name=SettlespotAPIGateway
server.port=8080

# Eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka

# JWT Secret (MUST match User Service)
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970

# ─── Routes ──────────────────────────────────────────────────────────────────

# User Service
spring.cloud.gateway.routes[0].id=SettlespotUserService
spring.cloud.gateway.routes[0].uri=lb://SETTLESPOTUSERSERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**,/users/**,/admin/**

# Property Service
spring.cloud.gateway.routes[1].id=SettlespotPropertyService
spring.cloud.gateway.routes[1].uri=lb://SETTLESPOTPROPERTYSERVICE
spring.cloud.gateway.routes[1].predicates[0]=Path=/properties/**

# Booking Service
spring.cloud.gateway.routes[2].id=SettlespotBookingService
spring.cloud.gateway.routes[2].uri=lb://SETTLESPOTBOOKINGSERVICE
spring.cloud.gateway.routes[2].predicates[0]=Path=/bookings/**

# CORS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-origins=http://localhost:3000
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
spring.cloud.gateway.globalcors.cors-configurations.[/**].allowed-headers=*
spring.cloud.gateway.globalcors.cors-configurations.[/**].allow-credentials=true